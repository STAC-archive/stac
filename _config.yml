# Address of the website (stac-archive.github.io/stac)
url: "https://stac-archive.github.io"
baseurl: "/stac"

# Every README.md in a measure folder becomes a small page
# from which the website reads the description text.
defaults:
  - scope:
      path: "Art and Aesthetics"
    values:
      layout: readme
  - scope:
      path: "Creativity"
    values:
      layout: readme
  - scope:
      path: "Personality and Individual Differences"
    values:
      layout: readme

# These files are meant for GitHub only, not for the website
exclude:
  - README.md
  - MAINTENANCE.md
  - README_Template.md
